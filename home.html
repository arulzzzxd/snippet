<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArulzXD API - Pastecode Snippet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAF7EF;
            --card-bg: #FFFDF8;
            --theme-border: #eab308;
            --theme-accent: #fde047;
            --theme-text: #121212;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1.2px, transparent 1.2px);
            background-size: 16px 16px;
        }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .brutal-border { border: 2.5px solid var(--theme-border) !important; }
        .btn-brutalism {
            background-color: #FFFDF8;
            border: 2px solid var(--theme-border);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 2px 2px 0px rgba(18, 18, 18, 0.1);
        }
        .btn-brutalism.yellow-accent { background-color: var(--theme-accent); }
        .preview-box {
            background: #121212;
            color: #38bdf8;
            padding: 12px;
            font-size: 13px;
            height: 85px;
            overflow: hidden;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Top Bar -->
    <header class="fixed top-0 left-0 right-0 bg-[#FAF7EF] border-b-2 brutal-border z-30 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <img src="https://cdn.arulz.biz.id/files/1wh5do.png" class="w-8 h-8 rounded-lg border-2 brutal-border">
                <span class="font-black text-sm uppercase tracking-tight">ArulzXD Snippets</span>
            </a>
            <div class="flex items-center gap-2">
                <a href="/snippet.html?new=true" class="btn-brutalism yellow-accent">+ BUAT SNIPPET</a>
                <div id="authNav">
                    <a href="/login.html" class="btn-brutalism">LOGIN</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 pt-20 pb-10 w-full flex-1">
        <!-- Hero Section -->
        <div class="bg-[#FFFDF8] border-2 brutal-border rounded-2xl p-6 mb-6 shadow-sm">
            <span class="px-3 py-1 bg-yellow-300 border-2 brutal-border text-[10px] font-black uppercase rounded-full inline-block mb-3">Community Hub</span>
            <h1 class="text-2xl sm:text-3xl font-black mb-2">Pastecode & Document Sharing</h1>
            <p class="text-xs font-semibold text-zinc-600">Simpan dan bagikan kode, snippet, serta dokumentasi README dengan cepat dan gratis.</p>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-6">
            <input type="text" id="searchInput" oninput="filterSnippets()" placeholder="Cari berdasarkan judul, bahasa, atau uploader..." class="w-full py-3 pl-4 pr-4 text-xs font-extrabold rounded-xl border-2 brutal-border bg-[#FFFDF8] focus:outline-none">
        </div>

        <!-- Grid Container -->
        <div id="snippetGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-center py-10 font-bold text-xs">Memuat Snippets...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t-2 brutal-border py-4 text-center text-[10px] font-mono font-bold text-zinc-500 uppercase">
        &copy; 2026 ARULZ-XD API · ALL RIGHTS RESERVED
    </footer>

    <script>
        let allSnippets = [];

        async function fetchUserStatus() {
            const res = await fetch('/api/user-status');
            const data = await res.json();
            if (data.loggedIn) {
                document.getElementById('authNav').innerHTML = `
                    <a href="/profile.html" class="flex items-center gap-2">
                        <img src="${data.user.avatar}" class="w-8 h-8 rounded-lg border-2 brutal-border object-cover">
                    </a>
                `;
            }
        }

        async function loadSnippets() {
            try {
                const res = await fetch('/api/pastecode');
                const result = await res.json();
                if (result.status) {
                    allSnippets = result.data;
                    renderSnippets(allSnippets);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderSnippets(snippets) {
            const container = document.getElementById('snippetGrid');
            if (!snippets || snippets.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center p-8 bg-[#FFFDF8] border-2 brutal-border rounded-xl font-bold text-xs">Belum ada snippet tersedia.</div>`;
                return;
            }

            container.innerHTML = snippets.map(s => `
                <div class="bg-[#FFFDF8] border-2 brutal-border rounded-xl p-4 shadow-sm cursor-pointer hover:translate-y-[-2px] transition-all" onclick="window.location.href='/snippet.html?id=${s.id}'">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-black code-font px-2 py-0.5 rounded border border-black bg-yellow-300 uppercase">${s.language}</span>
                        <span class="text-[9px] font-bold text-zinc-500 font-mono">📅 ${s.date}</span>
                    </div>
                    <h3 class="font-extrabold text-sm mb-1 truncate">${s.title}</h3>
                    <p class="text-[11px] font-medium text-zinc-600 mb-3 line-clamp-1">${s.desc || 'Tidak ada deskripsi'}</p>
                    <div class="preview-box mb-3">${escapeHTML(s.content.substring(0, 120))}</div>
                    <div class="flex items-center justify-between border-t-2 brutal-border pt-2">
                        <div class="flex items-center gap-2">
                            <img src="${s.avatar || 'https://cdn.arulz.biz.id/files/X1F0Cn.png'}" class="w-5 h-5 rounded-full border border-black object-cover">
                            <span class="text-[10px] font-extrabold text-zinc-700">@${s.username || 'Anonymous'}</span>
                        </div>
                        <span class="text-[9px] font-bold text-blue-600 uppercase">Lihat Detail →</span>
                    </div>
                </div>
            `).join('');
        }

        function filterSnippets() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSnippets.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.language.toLowerCase().includes(query) || 
                (s.username && s.username.toLowerCase().includes(query))
            );
            renderSnippets(filtered);
        }

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchUserStatus();
        loadSnippets();
    </script>
</body>
</html>
