<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArulzXD Pastecode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7EF; }
        .brutal-border { border: 2.5px solid #eab308; }
        .btn-action {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 12px;
            border: 2px solid #eab308;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#FFFDF8] border-2 brutal-border rounded-2xl p-6 shadow-md">
        <div class="text-center mb-6">
            <img src="https://cdn.arulz.biz.id/files/1wh5do.png" class="w-12 h-12 mx-auto mb-2 rounded-xl border-2 brutal-border">
            <h2 class="text-xl font-black uppercase">Masuk Akun</h2>
            <p class="text-xs text-zinc-600 font-semibold">Pilih metode login untuk membuat & mengelola snippet</p>
        </div>

        <!-- Social OAuth Login -->
        <div class="space-y-2 mb-4">
            <a href="/auth/google" class="btn-action bg-white text-zinc-800">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                LOGIN DENGAN GOOGLE
            </a>
            <a href="/auth/github" class="btn-action bg-zinc-900 text-white">
                <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                LOGIN DENGAN GITHUB
            </a>
        </div>

        <div class="flex items-center my-4">
            <div class="flex-1 border-t border-zinc-300"></div>
            <span class="px-2 text-[10px] font-bold text-zinc-400 uppercase">Atau Form Lokal</span>
            <div class="flex-1 border-t border-zinc-300"></div>
        </div>

        <!-- Local Login Form -->
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="mb-3">
                <label class="block text-[10px] font-black uppercase mb-1">Username</label>
                <input type="text" id="username" required class="w-full p-2.5 text-xs font-bold border-2 brutal-border rounded-xl bg-white focus:outline-none">
            </div>
            <div class="mb-4">
                <label class="block text-[10px] font-black uppercase mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-2.5 text-xs font-bold border-2 brutal-border rounded-xl bg-white focus:outline-none">
            </div>

            <button type="submit" id="btnSubmit" class="btn-action bg-yellow-300">LOGIN LOKAL</button>
            <button type="button" onclick="toggleMode()" id="btnToggle" class="w-full text-center text-[10px] font-extrabold text-zinc-600 mt-3">Belum punya akun? Registrasi</button>
        </form>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('btnSubmit').innerText = isLogin ? 'LOGIN LOKAL' : 'REGISTRASI LOKAL';
            document.getElementById('btnToggle').innerText = isLogin ? 'Belum punya akun? Registrasi' : 'Sudah punya akun? Login';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            alert(data.message);
            if (data.status) window.location.href = '/home.html';
        }
    </script>
</body>
</html>
